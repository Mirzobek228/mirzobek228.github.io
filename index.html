<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Verse</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
        }
        
        h1 {
            font-size: 60px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p {
            font-size: 20px;
            color: #a8b2d1;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: linear-gradient(45deg, #4ecdc4, #45b7d1);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nexus Verse</h1>
        <p>Добро пожаловать в Nexus Verse — пространство, где технологии встречаются с творчеством, а идеи превращаются в реальность.</p>
        
        <a href="#" class="btn">Узнать больше</a>
        <a href="mailto:contact@nexusverse.com" class="btn">Связаться с нами</a>
        
        <h2 style="margin-top: 50px; color: #4ecdc4;">О проекте</h2>
        <p>Nexus Verse — это digital-платформа для обмена идеями, создания проектов и развития сообщества единомышленников.</p>
    </div>
</body>
</html>
