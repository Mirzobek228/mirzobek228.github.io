<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Verse WPG</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e05353;
            --primary-hover: #ff6b6b;
            --primary-light: rgba(224, 83, 83, 0.15);
            --text-main: #f5f0f0;
            --text-muted: #b8a9a9;
            --border-color: rgba(255, 255, 255, 0.1);
            --card-bg-light: rgba(255, 255, 255, 0.05);
            --card-bg-dark: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        /* Базовые стили текста (меняются в зависимости от темы) */
        body {
            color: var(--text-main);
            line-height: 1.6;
            transition: background 0.5s ease, color 0.5s ease;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Анимированные фоны --- */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .bg-layer.active {
            opacity: 1;
        }

        /* День (Яркий, с облаками) */
        .bg-day {
            background: 
                linear-gradient(to bottom, rgba(135, 206, 235, 0.2), rgba(255, 255, 255, 0)),
                url('https://www.transparenttextures.com/patterns/light-sketch.png'), /* Легкая текстура */
                #87CEEB; /* Небесно-голубой цвет */
            /* Добавим анимированные облака (CSS-анимация) */
            background-image: 
                url('https://www.transparenttextures.com/patterns/light-sketch.png'),
                radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.8) 0px, transparent 50px),
                radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.8) 0px, transparent 70px),
                #87CEEB;
            animation: cloudsMove 60s linear infinite;
            background-position: 0 0, 0 0, 0 0, center;
        }

        @keyframes cloudsMove {
            from { background-position: 0 0, 0 0, 0 0, center; }
            to { background-position: -1000px 0, 0 0, 0 0, center; }
        }

        /* Закат (Оранжевый, медленный) */
        .bg-sunset {
            background: linear-gradient(to bottom, #ff7e5f, #feb47b);
            position: relative;
        }
        .bg-sunset::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #ff6b6b, transparent);
            opacity: 0.7;
        }

        /* Ночь (Темная, звезды) */
        .bg-night {
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 255, 255, 0.5) 1px, transparent 2px),
                radial-gradient(circle at 90% 80%, rgba(255, 255, 255, 0.5) 1px, transparent 2px),
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.3) 1px, transparent 3px),
                #0f172a;
            background-size: 200px 200px, 150px 150px, 300px 300px, cover;
            animation: starsTwinkle 10s infinite alternate;
        }

        @keyframes starsTwinkle {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        /* --- Панель переключения тем --- */
        .theme-switcher {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 200;
        }

        .theme-btn {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .theme-btn:hover {
            transform: scale(1.1);
            border-color: #fff;
        }

        /* Стили для кнопок тем */
        .btn-day {
            background: linear-gradient(135deg, #87CEEB 0%, #ffffff 100%);
            color: #f59e0b; /* Солнце */
        }

        .btn-sunset {
            background: linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%);
            color: #fff;
        }

        .btn-night {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0; /* Луна */
        }

        .theme-btn.active-theme {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* --- Адаптация элементов сайта под темы --- */
        
        /* Хедер */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.2); /* Полупрозрачный */
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            transition: background 0.5s ease;
        }
        /* При наведении/скролле хедер становится чуть темнее для читаемости */
        header.scrolled {
            background: rgba(0, 0, 0, 0.6);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
        }

        .server-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            transition: transform 0.2s;
        }
        .server-avatar:hover { transform: scale(1.05); }
        .server-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; color: #fff; }

        nav { display: flex; gap: 25px; }
        nav a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        nav a:hover { color: var(--primary-hover); }

        /* Герой (Главный экран) */
        .hero { padding: 100px 20px; text-align: center; }
        .hero h1 { font-size: 3rem; margin-bottom: 15px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .hero h1 span { color: var(--primary); }
        .hero p { color: rgba(255, 255, 255, 0.9); font-size: 1.2rem; max-width: 650px; margin: 0 auto 40px auto; text-shadow: 0 1px 5px rgba(0,0,0,0.2); }
        .btn {
            display: inline-block;
            background-color: var(--primary); color: #fff; padding: 12px 30px;
            border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
            border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(224, 83, 83, 0.4);
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

        /* Контейнер и Карточки */
        .container { max-width: 1050px; margin: 0 auto; padding: 60px 20px; }
        section { margin-bottom: 80px; }
        section h2 { font-size: 2rem; margin-bottom: 40px; text-align: center; color: #fff; }

        /* Новости (стиль Discord) */
        .news-feed { display: flex; flex-direction: column; gap: 20px; }
        .news-card {
            background: var(--card-bg-light);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            display: flex;
            gap: 20px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .news-author-avatar { width: 50px; height: 50px; border-radius: 12px; flex-shrink: 0; }
        .news-content-wrap { display: flex; flex-direction: column; gap: 6px; }
        .news-meta { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; color: rgba(255,255,255,0.6); }
        .news-author-name { color: #fff; font-weight: 600; }
        .news-text { font-size: 1rem; color: rgba(255,255,255,0.95); }

        /* Персонал */
        .staff-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 30px; }
        .staff-card {
            background: var(--card-bg-light);
            backdrop-filter: blur(5px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .staff-card:hover { background: rgba(255,255,255,0.1); transform: translateY(-8px); }
        .staff-avatar { width: 90px; height: 90px; border-radius: 24px; object-fit: cover; border: 4px solid rgba(255,255,255,0.2); }
        .staff-name { font-weight: 700; font-size: 1.2rem; color: #fff; }
        .staff-role { font-size: 0.9rem; color: var(--primary); font-weight: 500; }
        .staff-id { font-size: 0.8rem; color: rgba(255,255,255,0.5); }

        /* Донат */
        .donate-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; align-items: start; }
        .donate-box {
            background: var(--card-bg-light);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
        }
        .donate-table h3 { color: #fff; font-size: 1.3rem; margin-bottom: 20px; }
        .donate-table ul { list-style: none; }
        .donate-table li { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-color); font-size: 1rem; }
        .donate-table li span { color: var(--primary); font-weight: 600; }
        
        .tier-info { margin-top: 30px; font-size: 0.95rem; color: rgba(255,255,255,0.85); }
        .tier-info p { margin-bottom: 10px; }

        .course-box {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
        }
        .course-val { font-size: 2.5rem; font-weight: 800; color: #fff; margin: 10px 0; }
        .course-rate { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 5px; }

        /* Модальное окно для пасхалки */
        .modal {
            display: none; position: fixed; z-index: 1000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
            opacity: 0; transition: opacity 0.3s;
        }
        .modal.open { display: flex; opacity: 1; }
        .modal-content {
            max-width: 80%; max-height: 80vh
